name: CI build check

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore iStCAD_1.sln
      - name: Build (Release) - compile errors fail the job
        shell: pwsh
        run: dotnet build iStCAD_1.sln -c Release --no-restore -v minimal -nologo 2>&1 | Tee-Object -FilePath build.log; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test (runs only if test projects exist)
        run: dotnet test iStCAD_1.sln -c Release --no-build --nologo --verbosity minimal
        continue-on-error: true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
